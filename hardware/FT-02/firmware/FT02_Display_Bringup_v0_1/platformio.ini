[platformio]
default_envs = ft02-pbf-a1-n16r8-spi40
boards_dir = boards

[env:ft02-pbf-a1-n16r8-spi40]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
board_build.partitions = ft02_16mb_large_app.csv
board_upload.maximum_size = 11534336
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    zinggjm/GxEPD2

; FT-02 v2.75k49 + ES8311 Quiet-Window EPD Guard + Pop-Safe Stop A11 + PA-SD + Timer + S3 Clock + Speaker 2/3 + Field Library v0.8.2 + FieldManual Runtime A3.15
; ESP32-S3 N16R8: 16 MB QIO flash + 8 MB OPI PSRAM
; SD FSPI Mode3 @ 40 MHz: SCK=GPIO42, MOSI=GPIO2, MISO=GPIO1, CS=GPIO41
