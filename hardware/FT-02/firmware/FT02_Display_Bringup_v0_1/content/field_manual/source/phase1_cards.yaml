- id: FOD-003
  title: 生熟食物交叉污染控制
  category: FOD
  priority: normal
  quick_access: false
  trigger: 同时处理生肉、生蛋和即食食物。
  immediate_actions:
  - 先处理即食食物，再处理生食。
  - 生熟使用不同刀具、砧板和容器。
  - 接触生食后用肥皂洗手至少20秒。
  steps:
  - 生食放在密闭容器并置于熟食下方。
  - 台面和工具用清洁剂清洗后再消毒。
  - 不具备清洗条件时，使用一次性垫材和独立工具。
  alternatives:
  - 工具不足时，先完成熟食处理并封存，再彻底清洁工具后处理生食。
  stop_or_escalate:
  - 出现生肉汁滴到熟食、饮水或餐具上时，被污染物品不得直接食用。
  do_not:
  - 不要用处理生肉的盘子盛熟食。
  - 不要用同一块脏布反复擦拭所有区域。
  completion_check:
  - 生熟区域分开；手和工具已清洁；即食食物已覆盖。
  tools:
  - 肥皂
  - 独立容器
