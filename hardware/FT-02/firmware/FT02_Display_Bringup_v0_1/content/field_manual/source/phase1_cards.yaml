- id: ORG-001
  title: 队伍结伴与人员清点
  category: ORG
  priority: high
  quick_access: false
  trigger: 队伍开始移动、到达节点、遇到危险或准备休息。
  immediate_actions:
  - 两人一组结伴，明确彼此负责。
  - 指定领队和收尾。
  - 按姓名或编号完成清点。
  steps:
  - 出发前记录人数、目的地和预计到达时间。
  - 每个路口、障碍、休息点和事件后重新清点。
  - 任何人离队必须报告去向、路线和返回时间。
  - 发现失联立即停止全队前进。
  alternatives:
  - 人数较多时按小组清点，再由组长汇总。
  stop_or_escalate:
  - 人员失联、有人无法跟上或通信中断时停止移动并启动最后已知位置搜索流程。
  do_not:
  - 不要让体弱者走在队尾无人照看。
  - 不要以“应该跟上了”代替实际清点。
  completion_check:
  - 人数与名单一致；结伴关系明确；领队和收尾均已确认。
  tools:
  - 人员名单
  keywords:
  - 清点
  - 结伴
  source_refs: []
