- id: REP-002
  title: 电源线或接头破损
  category: REP
  priority: critical
  quick_access: false
  trigger: 导线绝缘破损、接头松动、打火、发热或有焦味。
  immediate_actions:
  - 立即关闭设备并断开电源。
  - 拔掉电池或上游保险。
  - 隔离并标记故障线缆。
  steps:
  - 确认无电后检查线芯是否断裂、腐蚀或烧黑。
  - 只允许对低压系统做临时修复。
  - 剪除烧损部分，使用匹配电流的压接端子或焊接恢复连接。
  - 使用热缩管或多层绝缘材料覆盖，并做应力释放。
  alternatives:
  - 没有合格接头时保持停用，不用扭线加胶带代替承载连接。
  stop_or_escalate:
  - 涉及市电、高压、电池主回路、进水或持续发热时停止操作并由专业人员处理。
  do_not:
  - 不要带电维修。
  - 不要用裸铜线替代保险丝。
  - 不要把不同线径随意并联。
  completion_check:
  - 连接无裸露；拉动不松脱；通电5分钟无发热、焦味或电压异常。
