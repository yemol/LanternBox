- id: ENR-001
  title: 锂电池异常发热或鼓胀
  category: ENR
  priority: critical
  quick_access: true
  trigger: 电池明显发热、鼓胀、异味、冒烟、漏液或充电异常。
  immediate_actions:
  - 立即停止充电和使用。
  - 能安全断电时切断电源。
  - 疏散人员并移开周围可燃物。
  steps:
  - 不要触碰鼓胀或冒烟电芯。
  - 设备未起火且可安全移动时，移到室外空旷不可燃地面。
  - 出现冒烟、喷气或火焰时立即远离并呼叫消防。
  - 冷却后隔离，不再使用。
  alternatives:
  - 无法安全移动时，关闭房门、撤离并等待消防。
  stop_or_escalate:
  - 火焰、连续喷气、多个电芯连锁发热、室内烟雾增加时立即撤离。
  do_not:
  - 不要刺穿、挤压或拆解。
  - 不要放入普通垃圾。
  - 不要重新充电测试。
  completion_check:
  - 电源已断；人员已撤到安全距离；电池被隔离并安排专业回收。
  tools:
  - 灭火器
  - 不可燃隔离区
  keywords:
  - 电池
  - 鼓包
  - 热失控
