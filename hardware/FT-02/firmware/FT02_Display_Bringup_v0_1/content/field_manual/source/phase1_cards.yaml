- id: ANM-005
  title: 营地非伤害声音预警线
  category: ANM
  priority: normal
  quick_access: false
  trigger: 需要在夜间提前发现动物或人员接近营地。
  immediate_actions:
  - 选择营地外围动物可能进入的通道。
  - 确保预警线不会穿过公共道路和人员主要通道。
  - 准备绳线、金属罐和石子。
  steps:
  - 把绳线设置在离地20至35厘米。
  - 每隔3至5米悬挂一个装有少量石子的金属罐。
  - 人员通道处留断口并做反光标记。
  - 天黑前逐段测试，确认营地内能听见。
  - 天亮后解除或重新标记。
  alternatives:
  - 没有金属罐时，用铃铛、硬塑料瓶和小石子替代。
  stop_or_escalate:
  - 线绳可能绊倒儿童、救援人员或牲畜时立即拆除。
  do_not:
  - 不得连接刀刃、尖刺、套索、弹射物或通电装置。
  - 不得设置无人知晓的隐藏机关。
  completion_check:
  - 任意一段被轻触时能发出清晰声音；人员通道安全；所有成员知道位置。
  tools:
  - 绳线
  - 金属罐
  - 石子
  keywords:
  - 预警线
  - 营地警戒
  source_refs: []
