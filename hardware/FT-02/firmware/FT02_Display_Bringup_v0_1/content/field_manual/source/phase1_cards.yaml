- id: NAV-003
  title: 无线电紧急联络格式
  category: NAV
  priority: high
  quick_access: false
  trigger: 需要用LoRa、对讲机或其他低带宽信道求助。
  immediate_actions:
  - 先说被呼叫对象，再说自己的呼号。
  - 报告位置、事件、人数和最紧急需求。
  - 发送后要求对方复述关键内容。
  steps:
  - 格式：对象—身份—位置—情况—人数—需求—下次联络时间。
  - 坐标分组慢读两遍。
  - 每次只传一个重点，避免长篇叙述。
  - 无回应时按固定间隔重试，并保留电量。
  alternatives:
  - 不能发坐标时，报告道路、地标、方向、距离和最后已知位置。
  stop_or_escalate:
  - 伤情恶化、位置变化或撤离计划改变时立即更新。
  do_not:
  - 不要占用信道反复闲聊。
  - 不要只说“出事了”而不报位置和人数。
  completion_check:
  - 对方已复述位置和需求；下一次联络时间已明确；日志已记录。
  tools:
