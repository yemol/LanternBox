- id: NAV-001
  title: 发现迷路或路线不确定
  category: NAV
  priority: high
  quick_access: true
  trigger: 无法确认当前位置、路线与地图不符，或连续两个参照物无法对应。
  immediate_actions:
  - 立即停止继续前进。
  - 回到最后一个确定位置；无法安全回退时原地停留。
  - 记录当前时间、最后可靠位置和大致行进方向。
  steps:
  - 检查地图朝向、坐标系和比例尺。
  - 用道路、河流、山脊、建筑和太阳方向至少两个参照物交叉定位。
  - 发送位置和计划给外部联系人。
  - 天黑、恶劣天气或有人受伤时优先建立庇护，不盲目赶路。
  alternatives:
  - 无信号时在安全开阔处尝试通信；不要为找信号进入悬崖、激流或未知区域。
  stop_or_escalate:
  - 剩余水、体温、伤情或天气开始威胁安全时立即转入求救和庇护流程。
  do_not:
  - 不要凭感觉持续走。
  - 不要把估算坐标当作精确位置。
  - 不要让队伍分散寻找路线。
  completion_check:
  - 队伍已停下并清点；最后可靠位置已记录；下一步是原地等待、回退或明确路线之一。
  tools:
  - 地图
  - 指南针
  keywords:
  - 迷路
  - 定位
  source_refs:
