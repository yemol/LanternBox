    status: field_test_required
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: ORG-002
  title: 值守交接
  category: ORG
  priority: normal
  quick_access: false
  trigger: 营地、设备、伤员或通信需要轮班值守。
  immediate_actions:
  - 下一班到位后再交班。
  - 口头报告人员、设备、风险和待办。
  - 双方共同检查关键物资和报警状态。
  steps:
  - 固定格式记录：时间、天气、人员、设备状态、异常、已采取措施、下一次检查时间。
  - 明确谁拥有决定权和紧急联系方法。
  - 交班人离开前，让接班人复述关键风险。
  alternatives:
  - 没有纸笔时，用终端日志或语音记录，并由接班人确认。
  stop_or_escalate:
  - 发现伤情变化、设备过热、火源异常、动物接近或通信中断时，不等交班时间，立即处理和报告。
  do_not:
  - 不要只说“一切正常”。
  - 不要在接班人未到位时离岗。
  completion_check:
  - 接班人已复述风险；记录完整；下一次检查时间明确。
  tools:
  - 日志
  keywords:
  - 交接
  - 值守
