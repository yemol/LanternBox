- id: ANM-004
  title: 发现蛇或发生蛇咬
  category: ANM
  priority: critical
  quick_access: true
  trigger: 近距离发现蛇，或疑似被蛇咬。
  immediate_actions:
  - 未被咬时停止靠近，给蛇留出逃离路线，缓慢后退。
  - 被咬后立即离开蛇的攻击距离并保持安静。
  - 呼叫急救并减少伤肢活动。
  steps:
  - 取下伤肢上的戒指、手表和紧身物。
  - 让伤者平卧，伤肢保持自然位置并简单固定。
  - 记录咬伤时间和肿胀边界变化。
  - 尽快转运，不捕捉蛇；安全时可远距离拍照。
  alternatives:
  - 没有夹板时，用衣物和直板限制大幅移动，但不绑紧。
  stop_or_escalate:
  - 出现呼吸困难、意识变化、快速肿胀、持续呕吐或严重出血时按危急情况处理。
  do_not:
  - 不要切开、吸吮、电击或冰敷。
  - 不要使用止血带。
  - 不要让伤者跑动。
  completion_check:
  - 伤者保持安静；紧身物已移除；时间和肿胀已记录；转运已启动。
  tools:
  - 标记笔
  - 简易固定材料
  keywords:
  - 蛇
  - 蛇咬
  source_refs:
  - SRC-RC-FIRSTAID
