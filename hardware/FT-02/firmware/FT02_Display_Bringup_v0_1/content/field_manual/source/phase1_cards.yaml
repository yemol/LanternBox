- id: SHL-001
  title: 快速选择临时庇护点
  category: SHL
  priority: high
  quick_access: false
  trigger: 需要在数小时内避雨、避风、保温或等待救援。
  immediate_actions:
  - 先避开洪水沟、河道、落石坡、枯树、孤立高点和电线。
  - 选择地势略高、排水良好、背风但可通风的位置。
  - 确认至少两条撤离路线。
  steps:
  - 睡眠区与烹饪区分开。
  - 燃烧设备放在庇护外并远离门窗进风口。
  - 铺设隔热层，把人员与湿冷地面隔开。
  - 把水、急救、照明和通信放在伸手可及处。
  alternatives:
  - 建筑物受损时，只使用结构完整、无燃气味、无积水触电风险的区域。
  stop_or_escalate:
  - 水位上升、山体有落石声、树木持续倾斜、出现烟气或CO报警时立即转移。
  do_not:
  - 不要在干涸河床、桥下排水道或独立大树下扎营。
  - 不要在睡眠区使用炭火或发电机。
  completion_check:
  - 位置无明显次生灾害；排水和通风可用；撤离路线明确；人员与地面隔热。
  tools:
  - 防水布
  - 隔热垫
  keywords:
  - 庇护
  - 营地
  source_refs:
  - SRC-READY
  - SRC-CDC-POWER
