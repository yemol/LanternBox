- id: ANM-002
  title: 遭遇野猪逼近
  category: ANM
  priority: critical
  quick_access: true
  trigger: 野猪近距离盯视、低头、跺脚、发出威吓声或开始逼近。
  immediate_actions:
  - 不要转身奔跑。
  - 缓慢向侧后方退开。
  - 移动到大树、车辆、巨石或建筑物后方。
  steps:
  - 始终让坚固障碍物位于人与野猪之间。
  - 不要堵住野猪和幼崽的退路。
  - 有稳固高处时迅速进入。
  - 发生冲撞时绕障碍移动；无处可躲时用背包或硬物保护腹部和大腿。
  alternatives:
  - 没有坚固障碍时，保持正面观察并沿开阔方向缓慢退离。
  stop_or_escalate:
  - 动物持续逼近、出现多只、附近有幼崽或有人受伤时立即撤离并求助。
  do_not:
  - 不要靠近幼崽。
  - 不要追赶或投掷食物。
  - 不要倒地装死作为首选。
  completion_check:
  - 野猪离开视线后等待至少10分钟；确认无同伴后沿相反方向撤离。
  tools:
  - 背包或硬质屏障
