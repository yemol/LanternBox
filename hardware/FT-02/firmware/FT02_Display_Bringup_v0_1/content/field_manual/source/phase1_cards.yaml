- id: FIR-003
  title: 疑似一氧化碳中毒
  category: FIR
  priority: critical
  quick_access: true
  trigger: 室内或半封闭空间使用燃烧设备后，多人出现头痛、头晕、恶心、乏力、胸痛或意识混乱。
  immediate_actions:
  - 立即让所有人撤到室外新鲜空气处。
  - 在安全位置呼叫急救和消防。
  - 能安全做到时关闭燃烧设备；不要返回污染空间。
  steps:
  - 检查呼吸和意识。
  - 无正常呼吸时开始CPR并使用AED。
  - 保持患者休息，等待专业救援。
  - 让救援人员知道使用了发电机、炭火、炉具或发动机。
  alternatives:
  - 没有通信时，派未暴露人员到安全处求助，其他人留在上风向。
  stop_or_escalate:
  - 任何意识变化、胸痛、呼吸困难、孕妇或多人同时不适都按紧急情况处理。
  do_not:
  - 不要依靠开窗后继续留在室内。
  - 不要自行驾车运送意识异常患者。
  - 不要再次启动设备。
  completion_check:
  - 人员全部离开污染区；急救已联系；污染空间保持无人进入。
  tools:
  - CO报警器
  keywords:
  - 一氧化碳
  - 发电机
  - 炭火
