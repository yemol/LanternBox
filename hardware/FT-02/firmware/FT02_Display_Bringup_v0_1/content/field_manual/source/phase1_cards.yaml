- id: REP-001
  title: 发现管路漏水
  category: REP
  priority: high
  quick_access: false
  trigger: 管道、接头或容器持续漏水，可能损坏设备或污染物资。
  immediate_actions:
  - 关闭上游阀门或水泵。
  - 切断附近电源。
  - 把物资和电子设备移出积水区。
  steps:
  - 擦干漏点并确认具体位置。
  - 低压小裂缝可用橡胶片覆盖后用卡箍或绳带压紧。
  - 接头松动时在无压力状态下重新紧固。
  - 放置接水容器并持续观察。
  alternatives:
  - 没有卡箍时，用自行车内胎或厚橡胶片加多圈强力胶带临时压紧。
  stop_or_escalate:
  - 裂缝扩大、管路变形、热水或化学液体泄漏时停止临修并隔离区域。
  do_not:
  - 不要在带压状态拆接头。
  - 不要让水流入配电箱、插座或电池。
  completion_check:
  - 上游已关闭；漏量明显降低或停止；临修点无继续扩张；后续正式维修已标记。
