- id: SHL-002
  title: 决定留守还是撤离
  category: SHL
  priority: high
  quick_access: true
  trigger: 当前地点出现火、水、结构、治安或资源风险，需要决定是否离开。
  immediate_actions:
  - 列出当前地点的立即威胁。
  - 确认目的地、路线、交通和到达后的资源。
  - 计算队伍最慢成员所需时间。
  steps:
  - 满足以下任一条件优先撤离：威胁持续扩大；建筑不安全；官方发布撤离；医疗需求无法满足；水和空气受污染。
  - 撤离前只带关键物资：水、药、保温、照明、通信、证件。
  - 向外部联系人报告路线和预计到达时间。
  alternatives:
  - 没有可靠目的地和路线时，先改善当前庇护并持续监测，不因焦虑盲目移动。
  stop_or_escalate:
  - 路线被阻断、天气恶化、队伍无法维持体温或有人伤情加重时重新评估并停止推进。
  do_not:
  - 不要让队伍分散。
  - 不要为了非关键物资延误撤离。
  - 不要在夜间进入未侦察路线，除非当前地点更危险。
  completion_check:
  - 留守或撤离决定已明确；所有人知道路线、集合点和失散方案。
  tools:
  - 地图
  - 撤离包
