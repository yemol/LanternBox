- id: SHL-003
  title: 夜间转移队伍
  category: SHL
  priority: high
  quick_access: false
  trigger: 必须在黑暗中移动，且等待天亮风险更高。
  immediate_actions:
  - 确认每人照明、电量和保温。
  - 安排领队和收尾人员。
  - 所有人两两结伴并完成清点。
  steps:
  - 降低速度，队伍间距保持可见或可触达。
  - 每个路口、跨水点和障碍后重新清点。
  - 只走已知路线，避开河岸、悬崖和倒塌建筑。
  - 每30分钟检查体温、伤情和电量。
  alternatives:
  - 照明不足时使用反光标记或短绳保持队形，但不要把人员硬绑在一起。
  stop_or_escalate:
  - 失去队员、路线不明、照明不足或天气突然恶化时立即停止并建立临时庇护。
  do_not:
  - 不要单独前出侦察超过可视距离。
  - 不要戴耳机。
  - 不要为赶时间缩短清点流程。
  completion_check:
  - 全员到达检查点；人数、伤情和装备已记录；下一段路线确认。
  tools:
