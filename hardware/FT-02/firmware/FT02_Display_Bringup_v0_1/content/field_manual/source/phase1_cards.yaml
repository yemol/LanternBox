- id: HYG-001
  title: 应急条件下洗手
  category: HYG
  priority: high
  quick_access: false
  trigger: 如厕后、处理伤口前、做饭前、接触生食或垃圾后。
  immediate_actions:
  - 用安全水打湿双手。
  - 涂肥皂并搓洗至少20秒。
  - 用安全水冲净并自然风干或用干净材料擦干。
  steps:
  - 搓洗手心、手背、指缝、拇指、指尖和手腕。
  - 没有安全自来水时，用煮沸或消毒后的水。
  alternatives:
  - 没有肥皂和水时，使用酒精含量至少60%的免洗手消毒剂；手明显脏污时仍应尽快用水和肥皂清洗。
  stop_or_escalate:
  - 接触污水、呕吐物、粪便或伤口后，手部有破损时加强防护并更换手套。
  do_not:
  - 不要多人共用脏毛巾。
  - 不要用未经处理的污染水冲洗伤口或餐具。
  completion_check:
  - 所有关键部位已搓洗20秒；手已完全冲净并干燥。
  tools:
