- id: HYG-002
  title: 无厕所时处理排泄物
  category: HYG
  priority: high
  quick_access: false
  trigger: 没有可用厕所，且必须临时处理排泄物。
  immediate_actions:
  - 优先使用便携式厕所或排泄物袋并密封带走。
  - 无法带走且当地允许掩埋时，选择距水源、营地和道路至少60米的位置。
  - 挖约15至20厘米深的小坑。
  steps:
  - 排泄后完全回填并恢复表面。
  - 厕纸和卫生用品装袋带走。
  - 在厕所区设置洗手点和明显标记。
  alternatives:
  - 硬地、雪地、高海拔、洪水区或人员密集区应使用密封袋带走，不掩埋。
  stop_or_escalate:
  - 地下水浅、附近有水源、洪水可能淹没或当地禁止掩埋时，必须改用密封收集。
  do_not:
  - 不要在河流、沟渠、道路或营地附近排泄。
  - 不要把厕纸和卫生用品留在地表。
  completion_check:
  - 排泄物已密封带走或按条件正确掩埋；洗手点可用；区域有标记。
  tools:
