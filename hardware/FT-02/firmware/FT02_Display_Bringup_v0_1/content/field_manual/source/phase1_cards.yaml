- id: HYG-003
  title: 接触污水后的清理
  category: HYG
  priority: high
  quick_access: false
  trigger: 房间、营地或物品接触污水、粪便或洪水。
  immediate_actions:
  - 限制人员进入污染区。
  - 穿防水靴、橡胶手套和护目镜。
  - 先移除固体污染物，再进行清洗和消毒。
  steps:
  - 开放伤口先用防水敷料覆盖。
  - 清洁工具与生活工具分开。
  - 工作结束后脱下污染装备，洗手并清洗可重复装备。
  - 污染食物、药品和吸水材料按废弃处理。
  alternatives:
  - 没有专业装备时，使用厚垃圾袋临时包覆鞋和小腿，但移动时防滑。
  stop_or_escalate:
  - 出现皮肤红肿、流脓、发热、腹泻或眼部接触后不适时就医。
  do_not:
  - 不要赤脚进入。
  - 不要把漂白剂与酸或氨混合。
  - 不要在封闭空间大量使用清洁剂。
  completion_check:
  - 污染区已隔离；人员完成清洁；污染物被密封；工具分区存放。
  tools:
