- id: FOD-002
  title: 洪水或火灾后食物处理
  category: FOD
  priority: high
  quick_access: false
  trigger: 食物接触洪水、污水、烟气、灭火剂或高温。
  immediate_actions:
  - 把接触洪水或污水的食物与安全食物隔离。
  - 丢弃纸盒、塑料袋、旋盖瓶和其他非密封包装食物。
  - 靠近火灾并受烟气或灭火剂影响的食物全部丢弃。
  steps:
  - 未损坏的全金属罐和商业软罐可按官方消毒流程处理后保留。
  - 清洁储存区前戴手套和防水鞋。
  - 处理结束后洗手并清洁工具。
  alternatives:
  - 无法确认包装是否密封时按污染处理。
  stop_or_escalate:
  - 罐体鼓包、泄漏、严重凹陷、锈穿或受高温变形时立即丢弃。
  do_not:
  - 不要尝味。
  - 不要只擦拭外包装后继续食用。
  - 不要把污染食物喂给动物。
  completion_check:
  - 污染食物已封袋隔离；安全食物转移到清洁区域；接触面已清洁。
  tools:
  - 手套
  - 垃圾袋
  keywords:
  - 洪水
  - 火灾
  - 食物污染
