- id: ENR-002
  title: 太阳能系统无输出
  category: ENR
  priority: normal
  quick_access: false
  trigger: 光照正常，但控制器无输入或无法给电池充电。
  immediate_actions:
  - 关闭负载。
  - 检查控制器和电池是否有过温、异味或鼓胀。
  - 确认面板无遮挡并朝向光源。
  steps:
  - 检查MC4或其他接头是否松脱、接反、进水或烧蚀。
  - 用万用表测量面板开路电压。
  - 面板电压正常时检查控制器输入端，再检查电池端。
  - 逐段恢复连接，每接一段观察电压和温升。
  alternatives:
  - 没有万用表时，先更换已知正常线缆或控制器，逐段排除，但不要短接面板。
  stop_or_escalate:
  - 接头烧黑、线缆发热、电池异常或电压超过设备额定值时停止。
  do_not:
  - 不要在强光下带电插拔大电流接头。
  - 不要直接把面板接到不兼容电池。
  completion_check:
  - 输入电压稳定；控制器开始充电；接头连续运行10分钟无发热。
  tools:
  - 万用表
  keywords:
  - 太阳能
  - 无输出
