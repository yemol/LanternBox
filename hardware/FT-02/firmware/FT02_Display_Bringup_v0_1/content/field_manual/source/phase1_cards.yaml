- id: ANM-001
  title: 营地食物与气味防动物管理
  category: ANM
  priority: high
  quick_access: false
  trigger: 在野外或动物活动区域建立营地。
  immediate_actions:
  - 睡眠区内不存放食物、垃圾、宠物食物和有气味用品。
  - 食物和垃圾立即密封。
  - 烹饪区、储食区与睡眠区分开。
  steps:
  - 优先使用防动物容器或固定储物箱。
  - 没有箱体时按当地规则悬挂食物，并远离睡眠区。
  - 饭后立即清理残渣、锅具和地面。
  - 垃圾和包装按食物同等管理。
  alternatives:
  - 可把锅盖或金属器皿放在储物箱上作为声音报警，但不能代替可靠密封。
  stop_or_escalate:
  - 动物反复接近、储物被破坏或营地位于明显兽道时迁移营地。
  do_not:
  - 不要把食物放在帐篷。
  - 不要燃烧或掩埋厨余。
  - 不要投喂动物。
  completion_check:
  - 睡眠区无气味物品；所有食物垃圾已密封；烹饪区地面无残渣。
  tools:
  - 密封容器
