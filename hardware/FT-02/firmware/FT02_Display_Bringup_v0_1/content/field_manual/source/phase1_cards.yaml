- id: FIR-004
  title: 淋湿后快速保温
  category: FIR
  priority: high
  quick_access: false
  trigger: 衣物被雨雪或落水浸湿，环境有风或低温。
  immediate_actions:
  - 立即离开风口和水边。
  - 脱去湿衣并擦干身体。
  - 穿上干燥内层、中层和防风防水外层。
  steps:
  - 优先保护头、颈、胸腹和腹股沟。
  - 坐卧在隔热垫上，不直接接触冷地。
  - 喝温热饮料仅限清醒且能吞咽者。
  - 持续观察是否出现发抖减弱、迟钝或说话含糊。
  alternatives:
  - 没有干衣时，先用塑料布挡风，再用睡袋、毯子或同伴衣物包裹。
  stop_or_escalate:
  - 出现意识异常、停止发抖或行动能力下降时转入失温卡并立即求助。
  do_not:
  - 不要穿着湿衣继续赶路。
  - 不要饮酒。
  - 不要直接贴近明火烘烤皮肤。
  completion_check:
  - 湿衣已移除；身体与地面隔热；风雨被阻挡；意识保持正常。
  tools:
