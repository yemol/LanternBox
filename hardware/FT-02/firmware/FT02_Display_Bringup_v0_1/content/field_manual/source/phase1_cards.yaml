- id: WAT-001
  title: 紧急情况下选择水源
  category: WAT
  priority: high
  quick_access: false
  trigger: 现有自来水被通知不安全、断水，或只能寻找替代水源。
  immediate_actions:
  - 优先使用未开封瓶装水。
  - 其次使用确认未污染的热水器储水或由安全水制成的冰。
  - 无法确认安全的水一律按污染水处理。
  steps:
  - 避开洪水、工业排放、油膜、异味、异常颜色、动物尸体附近和农药化肥区域。
  - 取水点尽量选上游、流动水段，并远离营地和排泄区。
  - 取水后先沉淀过滤，再煮沸或消毒。
  alternatives:
  - 雨水可作为待处理水收集，但必须使用干净容器并再次消毒。
  stop_or_escalate:
  - 怀疑化学、燃油、重金属或放射性污染时，煮沸无效，必须更换水源。
  do_not:
  - 不要饮用暖气锅炉、汽车散热器、泳池或消防系统中的水。
  - 不要仅凭清澈和无味判断安全。
  completion_check:
  - 水源风险已判断；容器已标记“未处理”；后续处理方法已确定。
  tools:
  - 干净容器
  keywords:
  - 水源
  - 取水
  source_refs:
  - SRC-CDC-WATER
  - SRC-CDC-WATER-SAFETY
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: WAT-002
  title: 浑浊水沉淀与预过滤
  category: WAT
  priority: normal
  quick_access: false
  trigger: 水中有泥沙、悬浮物或明显浑浊，需要在消毒前处理。
  immediate_actions:
  - 将水装入干净容器静置，直到大颗粒下沉。
  - 缓慢倒出上层水，不搅动沉淀。
  - 用多层干净布、咖啡滤纸或滤芯过滤。
  steps:
  - 过滤材料由粗到细排列。
  - 过滤后如果仍浑浊，再次沉淀和过滤。
  - 完成预过滤后必须继续煮沸或化学消毒。
  alternatives:
  - 没有滤材时，先延长沉淀时间，再从表层缓慢取水。
  stop_or_escalate:
  - 出现油膜、溶剂味、化学味、异常泡沫时停止处理并弃用水源。
  do_not:
  - 不要把过滤当作消毒。
  - 不要让脏手、脏杯接触处理后的水。
  completion_check:
  - 肉眼可见颗粒明显减少；处理水转入已清洁的容器；下一步消毒已开始。
  tools:
  - 容器
  - 布或滤纸
  keywords:
  - 浑浊水
  - 过滤
  source_refs:
  - SRC-CDC-WATER
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: WAT-003
  title: 饮水煮沸消毒
  category: WAT
  priority: high
  quick_access: true
  trigger: 水源可能含病原体，且有锅具和热源。
  immediate_actions:
  - 先对浑浊水沉淀和过滤。
  - 加热至持续翻滚沸腾。
  - 保持翻滚沸腾至少1分钟。
  steps:
  - 高海拔或无法确认海拔时可延长至3分钟。
  - 关火后加盖自然冷却。
  - 倒入清洁带盖容器并标记处理时间。
  alternatives:
  - 没有锅盖时，冷却期间用干净布覆盖，避免灰尘和昆虫。
  stop_or_escalate:
  - 闻到燃油、溶剂、农药或其他化学味时停止使用。
  do_not:
  - 不要用刚处理好的水加入未经处理的冰。
  - 不要用脏勺、手或杯口接触储水内部。
  completion_check:
  - 水完成规定沸腾时间；冷却过程受保护；容器密封并标记。
  tools:
  - 锅
  - 热源
  - 带盖容器
  keywords:
  - 煮沸
  - 饮水
  source_refs:
  - SRC-CDC-WATER-SAFETY
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: WAT-004
  title: 无香含氯漂白剂消毒饮水
  category: WAT
  priority: high
  quick_access: true
  trigger: 无法煮沸，且有标签标明含5%至9%次氯酸钠的无香普通液体漂白剂。
  immediate_actions:
  - 先沉淀并过滤浑浊水。
  - 确认漂白剂无香、无清洁添加剂、未过期。
  - 每3.8升清水加入8滴；浑浊水加入16滴。
  steps:
  - 充分搅匀。
  - 静置至少30分钟。
  - 水应有轻微氯味；没有氯味时重复同样剂量，再等15分钟。
  - 处理后密封保存。
  alternatives:
  - 滴管缺失时先用量具校准，不凭感觉倾倒。
  stop_or_escalate:
  - 漂白剂浓度不在5%至9%、有香味、含增稠剂或其他添加剂时不要使用。
  do_not:
  - 不要把漂白剂与酸、氨或其他清洁剂混合。
  - 不要用粉状、片状泳池氯直接按本卡剂量处理。
  completion_check:
  - 剂量和等待时间已完成；水有轻微氯味；容器已密封标记。
  tools:
  - 无香漂白剂
  - 滴管
  - 容器
  keywords:
  - 漂白剂
