- id: REP-003
  title: 帐篷或防水布撕裂
  category: REP
  priority: normal
  quick_access: false
  trigger: 帐篷外帐、防水布或遮蔽物被划破，雨风可能进入。
  immediate_actions:
  - 先降低受力：松开附近拉绳或增加临时支撑。
  - 擦干并清洁破口周围。
  - 从内外两侧覆盖补片。
  steps:
  - 补片每边至少超过裂口3厘米。
  - 圆化补片四角，减少再次翘起。
  - 沿受力方向增加胶带或缝线。
  - 修好后重新张紧，避免破口位于最高受力点。
  alternatives:
  - 没有补片时，用塑料袋、雨衣或备用布覆盖，再用胶带和绳线固定。
  stop_or_escalate:
  - 主支撑点断裂、结构可能倒塌或强风继续增大时撤到更安全庇护点。
  do_not:
  - 不要在表面潮湿、泥污时直接贴胶。
  - 不要把裂口拉紧后只贴单面胶带。
  completion_check:
  - 补片边缘完全贴合；喷水测试无明显渗漏；张紧后裂口不继续扩大。
  tools:
  - 补片
  - 胶带
  - 针线
  keywords:
  - 帐篷
  - 防水布
