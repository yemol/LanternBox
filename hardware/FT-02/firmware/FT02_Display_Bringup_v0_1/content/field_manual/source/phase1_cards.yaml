- id: NAV-002
  title: 记录和传递坐标
  category: NAV
  priority: normal
  quick_access: false
  trigger: 需要保存位置或向他人报告坐标。
  immediate_actions:
  - 确认坐标系，优先使用WGS-84。
  - 统一按“纬度在前、经度在后”记录。
  - 同时记录时间和定位精度。
  steps:
  - 保留至少小数点后5位。
  - 检查经纬度范围和正负号。
  - 在离线地图上目视确认点位没有落入明显错误区域。
  - 语音传递时分组慢读，并让对方复述。
  alternatives:
  - 无法获得GNSS时，明确标记为“估算位置”，并附道路、地标和方向。
  stop_or_escalate:
  - 坐标落入海上、其他国家或远离实际区域时停止发送并重新检查顺序与符号。
  do_not:
  - 不要省略坐标系。
  - 不要混用度分秒和十进制度而不标记。
  completion_check:
  - 坐标系、数值、时间、精度和复述确认全部完成。
  tools:
  - GNSS或地图
  keywords:
  - 坐标
  - WGS84
