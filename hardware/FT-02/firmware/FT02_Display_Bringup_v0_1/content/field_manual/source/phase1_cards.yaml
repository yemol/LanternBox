- id: FOD-001
  title: 停电后的冰箱与冷冻食物
  category: FOD
  priority: high
  quick_access: false
  trigger: 冰箱或冷冻柜断电。
  immediate_actions:
  - 立即停止频繁开门。
  - 记录停电开始时间。
  - 准备冰块、保冷箱和温度计。
  steps:
  - 冰箱门未开时，易腐食物约可维持4小时。
  - 断电超过4小时，将易腐食物转入能保持4摄氏度以下的保冷箱；无法保持时丢弃。
  - 满载冷冻柜约维持48小时，半满约24小时。
  - 恢复供电后，仍有冰晶或温度不高于4摄氏度的冷冻食物可继续使用或再次冷冻。
  alternatives:
  - 没有温度计且无法确认时间时，对肉、蛋、奶、熟食和剩菜采取丢弃策略。
  stop_or_escalate:
  - 食物出现异味、黏液、胀包，或易腐食物高于4摄氏度超过2小时，丢弃。
  do_not:
  - 不要尝味判断安全。
  - 不要把食物放在室外雪地，避免温度波动和动物污染。
  completion_check:
  - 断电时间已记录；保留和丢弃食物已分开；冷藏区恢复到4摄氏度以下。
  tools:
  - 温度计
  - 保冷箱
  - 冰块
  keywords:
  - 停电
  - 冰箱
  - 食物
