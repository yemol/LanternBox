- id: ENR-003
  title: 保险丝反复熔断
  category: ENR
  priority: high
  quick_access: false
  trigger: 更换保险丝后再次熔断或设备一上电就断电。
  immediate_actions:
  - 关闭电源并断开电池。
  - 不要再次换更大规格保险丝。
  - 检查线缆破损、接反、进水和焦痕。
  steps:
  - 断开所有负载。
  - 装回原规格保险丝后逐个接入负载。
  - 接入某一路后再次熔断，保持该路断开并检查短路或过载。
  - 测量负载电流并与保险丝及线径额定值比较。
  alternatives:
  - 没有测量工具时，保持故障支路停用，不进行试错式反复通电。
  stop_or_escalate:
  - 主线烧蚀、持续冒烟、无法识别回路或涉及市电时停止并交专业人员。
  do_not:
  - 不要用金属丝、铝箔或更大保险丝代替。
  - 不要绕过保险丝直接供电。
  completion_check:
  - 故障支路已隔离；原规格保险丝保持正常；线缆无异常发热。
  tools:
  - 原规格保险丝
