cards:
- id: MED-001
  title: 严重外伤出血
  category: MED
  priority: critical
  quick_access: true
  trigger: 血液持续流出、喷射，或敷料很快被浸透。
  immediate_actions:
  - 确认现场安全并戴手套。
  - 立即呼叫急救并取得止血带。
  - 用手或厚敷料持续直接压迫伤口。
  steps:
  - 保持持续压迫，不要反复掀开查看。
  - 敷料浸透时在上面继续加敷料。
  - 四肢危及生命的出血且直接压迫无效时，按止血带说明绑在伤口上方、不要压在关节上。
  - 收紧至出血停止，并记录时间。
  alternatives:
  - 没有敷料时，用折叠干净布料或衣物直接压迫。
  stop_or_escalate:
  - 出血不停、出现意识改变、皮肤湿冷、呼吸加快时立即转运。
  do_not:
  - 不要拔出深插伤口的异物。
  - 不要松开已经有效止血的止血带。
  - 不要把止血带绑在颈部、躯干或关节上。
  completion_check:
  - 伤口不再持续出血；敷料没有继续快速浸透；急救或转运已启动。
  tools:
  - 手套
  - 敷料
  - 止血带
  keywords:
  - 止血
  - 大出血
  - tourniquet
  source_refs:
  - SRC-RC-FIRSTAID
  - SRC-RC-BLEEDING
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-002
  title: 成人无呼吸：心肺复苏与AED
  category: MED
  priority: critical
  quick_access: true
  trigger: 成人无反应，且不呼吸或只有濒死喘息。
  immediate_actions:
  - 让他人呼叫急救并取AED。
  - 把患者仰卧放在坚硬平面。
  - 立即开始胸外按压。
  steps:
  - 双手重叠放在胸骨下半部中央。
  - 肩膀位于双手正上方，肘部伸直。
  - 按压频率每分钟100至120次，深度至少5厘米，每次让胸廓完全回弹。
  - 受过训练时按30次按压、2次人工呼吸循环；不会吹气时持续按压。
  - AED到达后开机，贴电极并完全按语音提示操作。
  alternatives:
  - 只有一人时，先用手机免提呼叫急救，再开始按压。
  stop_or_escalate:
  - 恢复正常呼吸、专业人员接手、现场变得不安全或施救者无法继续时停止。
  do_not:
  - 不要在软床上按压。
  - AED分析或放电时不要接触患者。
  - 不要因检查脉搏长时间中断按压。
  completion_check:
  - 按压持续进行；AED已接入；中断尽量少于10秒。
  tools:
  - AED
  keywords:
  - CPR
  - AED
  - 心肺复苏
  source_refs:
  - SRC-RC-CPR
  - SRC-RC-CPR-GUIDE
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-003
  title: 成人或儿童窒息
  category: MED
  priority: critical
  quick_access: true
  trigger: 患者无法咳嗽、说话或呼吸，发不出声音或皮肤发青。
  immediate_actions:
  - 立即呼叫急救。
  - 站在患者侧后方。
  - 给予5次肩胛骨之间的背部拍击。
  steps:
  - 5次背部拍击无效时，站到身后。
  - 双手在肚脐上方、胸骨下方做5次向内向上的腹部冲击。
  - 交替进行5次背部拍击和5次腹部冲击。
  - 患者失去反应时，小心放倒并开始心肺复苏；每次打开气道时只移除看得见的异物。
  alternatives:
  - 孕妇或腹部无法环抱者，改在胸骨下半部做胸部冲击。
  stop_or_escalate:
  - 异物排出后仍持续咳嗽、呼吸困难或胸腹疼痛时接受医疗评估。
  do_not:
  - 不要盲目用手指掏口腔。
  - 患者还能有力咳嗽时不要拍背或冲击，让其继续咳嗽。
  completion_check:
  - 患者能正常呼吸、说话或有力咳嗽；或已转入CPR和AED流程。
  tools: []
  keywords:
  - 窒息
  - 噎住
  - choking
  source_refs:
  - SRC-RC-CHOKING
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-004
  title: 热力烧伤初步处理
  category: MED
  priority: high
  quick_access: true
  trigger: 皮肤接触火焰、热液、蒸汽或高温物体。
  immediate_actions:
  - 脱离热源并确认现场安全。
  - 取下未粘住皮肤的衣物、戒指和手表。
  - 用干净凉流动水持续冷却至少15分钟。
  steps:
  - 大面积冷却时同时防止失温。
  - 冷却后保持伤口清洁。
  - 需要转运时用无粘性的干净敷料或保鲜膜松散覆盖。
  alternatives:
  - 无流动水时，用干净凉水浸湿的布反复更换。
  stop_or_escalate:
  - 面部、气道、手、脚、会阴、关节、环绕肢体、面积超过患者手掌，或电烧伤、化学烧伤时立即求助。
  do_not:
  - 不要用冰直接敷。
  - 不要涂牙膏、油脂或药膏。
  - 不要撕掉粘住皮肤的衣物。
  - 不要挑破水疱。
  completion_check:
  - 烧伤区域已持续冷却；紧身物已移除；伤口已清洁覆盖或转运已启动。
  tools:
  - 清洁水
  - 无粘敷料
  keywords:
  - 烧伤
  - 烫伤
  source_refs:
  - SRC-RC-BURNS
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-005
  title: 疑似骨折与临时固定
  category: MED
  priority: high
  quick_access: false
  trigger: 肢体变形、剧痛、肿胀、无法活动、骨头外露或受伤时有断裂声。
  immediate_actions:
  - 让伤者停止移动受伤部位。
  - 检查伤处远端的颜色、温度、感觉和活动。
  - 开放伤口先覆盖并控制出血。
  steps:
  - 保持发现时姿势，不强行拉直。
  - 只有必须移动或转运且会固定时，使用有软垫的硬板固定伤处上下两个关节。
  - 固定带打在夹板上，不直接压伤口或骨突。
  - 固定后再次检查远端循环和感觉。
  alternatives:
  - 没有夹板时，用木板、折叠硬纸板、登山杖或健侧肢体辅助固定。
  stop_or_escalate:
  - 头颈脊柱、骨盆、大腿骨损伤；远端发白发冷麻木；骨头外露；严重出血时立即求助。
  do_not:
  - 不要把外露骨头推回。
  - 不要反复测试能否活动。
  - 不要为了上夹板强行复位。
  completion_check:
  - 伤处不再移动；固定前后远端颜色、温度和感觉没有恶化；转运路线已确定。
  tools:
  - 夹板
  - 软垫
  - 固定带
  keywords:
  - 骨折
  - 夹板
  source_refs:
  - SRC-RC-FRACTURE
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-006
  title: 高温不适与疑似热射病
  category: MED
  priority: critical
  quick_access: true
  trigger: 高温环境中出现头晕、无力、呕吐、无法站立；或出现意识异常、抽搐、昏迷。
  immediate_actions:
  - 立即移到阴凉通风处。
  - 脱去多余衣物。
  - 意识异常、抽搐或昏迷时立即呼叫急救并开始主动降温。
  steps:
  - 用凉水喷湿皮肤并持续扇风。
  - 将冰袋或冷湿布放在颈部、腋窝和腹股沟。
  - 清醒且能吞咽者小口补充含电解质饮料或水。
  - 意识异常或呕吐者侧卧，不给口服液体。
  alternatives:
  - 没有冰袋时，用湿毛巾、浸水衣物和持续扇风。
  stop_or_escalate:
  - 降温10至15分钟无改善、无法站立、反复呕吐、意识变化、抽搐时立即转运。
  do_not:
  - 不要让意识异常者喝水。
  - 不要让患者继续走动或劳动。
  - 不要只靠退烧药处理。
  completion_check:
  - 患者转入凉爽环境；持续降温已开始；意识和呼吸被持续监测；急救已联系。
  tools:
  - 凉水
  - 风扇
  - 冷敷物
  keywords:
  - 中暑
  - 热射病
  - 热衰竭
  source_refs:
  - SRC-RC-HEAT
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-007
  title: 失温处理
  category: MED
  priority: critical
  quick_access: true
  trigger: 湿冷环境中持续发抖、动作迟缓、说话含糊、判断力下降，或停止发抖。
  immediate_actions:
  - 移到避风、干燥和较温暖处。
  - 脱去湿衣并擦干身体。
  - 用干燥衣物、毯子和防水层包裹，优先温暖躯干和头部。
  steps:
  - 让患者保持平卧并减少不必要移动。
  - 热水袋或暖包先包布，再放在胸部、腋窝和腹股沟附近。
  - 清醒且能吞咽者可小口喝温热无酒精、无咖啡因饮料。
  - 持续检查呼吸和意识。
  alternatives:
  - 没有毯子时，用干衣、睡袋、塑料布和同伴体温分层保温。
  stop_or_escalate:
  - 意识异常、停止发抖、呼吸很慢、身体僵硬时立即求助并准备CPR。
  do_not:
  - 不要揉搓四肢。
  - 不要直接接触高温热源。
  - 不要饮酒。
  - 不要让患者自行剧烈运动取暖。
  completion_check:
  - 湿衣已移除；躯干被持续保温；意识和呼吸稳定或转运已启动。
  tools:
  - 干衣
  - 毯子
  - 暖包
  keywords:
  - 失温
  - 低体温
  source_refs:
  - SRC-RC-HYPOTHERMIA
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
- id: MED-008
  title: 动物咬伤与狂犬病暴露
  category: MED
  priority: high
  quick_access: true
  trigger: 被陌生、流浪或野生哺乳动物咬伤、抓伤，或唾液接触破损皮肤、眼口鼻。
  immediate_actions:
  - 先远离动物并控制严重出血。
  - 立即用大量肥皂和流动水清洗伤口15分钟。
  - 尽快前往医疗机构评估狂犬病和破伤风处置。
  steps:
  - 清洗后用干净敷料覆盖。
  - 记录动物种类、外观、行为、地点和时间。
  - 宠物咬伤时索要疫苗记录；不要自行捕捉野生动物。
  alternatives:
  - 没有流动水时，用充足清洁水持续冲洗并反复使用肥皂。
  stop_or_escalate:
  - 伤口深、位于头颈手部、出血不停、动物行为异常、蝙蝠接触或无法确认动物状态时立即就医。
  do_not:
  - 不要用嘴吸伤口。
  - 不要自行缝合或封闭深咬伤。
  - 不要等待出现症状后再处理。
  completion_check:
  - 伤口已冲洗15分钟；暴露信息已记录；医疗评估已启动。
  tools:
  - 肥皂
  - 清洁水
  - 敷料
  keywords:
  - 咬伤
  - 抓伤
  - 狂犬病
  source_refs:
  - SRC-RC-BITE
  - SRC-CDC-RABIES
  review:
    status: source_reviewed
    last_reviewed: '2026-07-31'
