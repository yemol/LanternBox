- id: ANM-003
  title: 遭遇流浪犬或犬群
  category: ANM
  priority: critical
  quick_access: true
  trigger: 陌生犬持续靠近、包围、低吼、露齿或追逐。
  immediate_actions:
  - 停止奔跑，身体侧向站立。
  - 避免直盯犬眼，但持续观察。
  - 用低沉坚定声音命令后退。
  steps:
  - 缓慢后退到门、车辆、围栏或高处。
  - 把背包、自行车或木板放在身体与犬之间。
  - 犬扑来时保持屏障在前，不用手脚主动伸向犬口。
  - 倒地时蜷缩，双手保护头颈，面部朝下。
  alternatives:
  - 没有屏障时，用外套缠住前臂仅作最后防护，并持续向安全处撤离。
  stop_or_escalate:
  - 被咬破皮肤、犬只行为异常或无法脱离包围时立即求助并转入咬伤卡。
  do_not:
  - 不要尖叫奔跑。
  - 不要挥舞食物诱导犬群。
  - 不要把儿童留在队伍边缘。
  completion_check:
  - 人员进入封闭安全区；犬群不再接近；伤口已检查和处理。
  tools:
  - 背包
  - 硬质屏障
  keywords:
  - 狗
  - 犬群
