- id: ORG-003
  title: 事件现场简短记录
  category: ORG
  priority: normal
  quick_access: false
  trigger: 发生伤情、设备故障、位置变化或资源消耗。
  immediate_actions:
  - 立即记录时间。
  - 记录地点或坐标。
  - 记录发生了什么和已经做了什么。
  steps:
  - 使用固定格式：时间—位置—人员—事件—动作—结果—下一步。
  - 数字、药物、止血带时间、坐标和电量单独核对。
  - 每次状态变化追加新记录，不覆盖旧记录。
  alternatives:
  - 无法打字时先录音，恢复条件后转成文字。
  stop_or_escalate:
  - 记录与实际状态冲突时，以现场重新确认结果为准，并保留更正记录。
  do_not:
  - 不要依赖记忆延后补写。
  - 不要删除错误记录，应追加更正。
  completion_check:
  - 记录包含时间、位置、动作和结果；下一位接手者能据此继续。
  tools:
  - 终端日志
  keywords:
  - 记录
  - 事件日志
  source_refs: []
  review:
    status: field_test_required
    last_reviewed: '2026-07-31'
    notes: 上线前需完成中文措辞复核与实机分页检查。
