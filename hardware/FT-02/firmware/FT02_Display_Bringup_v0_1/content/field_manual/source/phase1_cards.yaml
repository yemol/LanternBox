- id: FIR-002
  title: 营火彻底熄灭
  category: FIR
  priority: high
  quick_access: false
  trigger: 准备离开营火、睡觉或风力增大。
  immediate_actions:
  - 停止加柴并摊开余烬。
  - 缓慢浇水直到停止嘶响。
  - 用工具搅拌灰烬和炭块。
  steps:
  - 再次浇水并翻动所有炭块。
  - 手背靠近灰烬上方检查热量，不直接触摸。
  - 仍有热量、烟或红光时继续浇水搅拌。
  alternatives:
  - 水不足时使用大量湿土或砂覆盖、搅拌，再检查热量；这不是首选。
  stop_or_escalate:
  - 无法完全熄灭或风将火星带走时立即求助并清理周围可燃物。
  do_not:
  - 不要把灰烬直接埋住后离开。
  - 不要把燃烧木炭倒入垃圾桶。
  completion_check:
  - 无烟、无红光、无可感热量；周围无飞散火星；工具已收回。
  tools:
  - 水
  - 铲子
  keywords:
  - 营火
  - 灭火
  source_refs:
  - SRC-NPS-CAMP
