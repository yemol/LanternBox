- id: FIR-001
  title: 室内起火与烟雾撤离
  category: FIR
  priority: critical
  quick_access: true
  trigger: 室内出现无法立即控制的火焰、浓烟或高温。
  immediate_actions:
  - 立即呼喊示警并启动撤离。
  - 贴近地面移动，避开烟层。
  - 使用最近的安全出口，不返回取物。
  steps:
  - 开门前用手背触摸门和把手；发热时不要开启，改走其他出口。
  - 通过门后随手关门，减缓火烟蔓延。
  - 到室外指定集合点清点人员并呼叫消防。
  alternatives:
  - 出口被堵时进入有外窗房间，关门、封堵门缝、在窗口发出求救信号。
  stop_or_escalate:
  - 衣物着火时立即停下、躺倒、翻滚压灭。
  - 有人失联时把最后位置告诉消防人员，不自行返回。
  do_not:
  - 不要乘电梯。
  - 不要在浓烟中站立行走。
  - 不要打开明显发热的门。
  completion_check:
  - 所有人员到集合点；人数已清点；消防已联系；无人返回建筑。
  tools: []
  keywords:
  - 火灾
  - 烟雾
  - 撤离
  source_refs:
