<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920">
<style>
.b{fill:#fff;stroke:#111;stroke-width:3}.p{fill:#f7e7bd}.m{fill:#dcecf6}.c{fill:#e4f0df}.s{fill:#eee3f5}
.t{font:28px Arial,'Noto Sans CJK SC',sans-serif;fill:#111}.h{font:bold 38px Arial,'Noto Sans CJK SC',sans-serif}
.sm{font:22px Arial,'Noto Sans CJK SC',sans-serif}.l{stroke:#222;stroke-width:4;fill:none}.r{stroke:#b00020;stroke-width:3;stroke-dasharray:10 8;fill:none}
</style>
<text x="55" y="55" class="h">FT-02 主控载板 v0.3 电气框图</text>
<rect x="55" y="110" width="220" height="150" rx="15" class="b p"/>
<text x="90" y="160" class="t">USB-C</text><text x="90" y="200" class="sm">5V + USB2.0</text><text x="90" y="235" class="sm">ESD / PTC / TVS</text>

<rect x="350" y="110" width="250" height="150" rx="15" class="b p"/>
<text x="385" y="160" class="t">TPS62132</text><text x="385" y="200" class="sm">3.3V / 3A Buck</text><text x="385" y="235" class="sm">5V_SYS → 3V3_SYS</text>

<rect x="680" y="85" width="330" height="230" rx="15" class="b m"/>
<text x="725" y="140" class="t">ESP32-S3-WROOM-1</text><text x="725" y="180" class="sm">N16R8</text>
<text x="725" y="220" class="sm">USB / SPI / UART / I²C</text>
<rect x="675" y="70" width="110" height="260" class="r"/><text x="625" y="350" class="sm">天线净空</text>

<rect x="1110" y="90" width="300" height="120" rx="15" class="b s"/>
<text x="1160" y="140" class="t">MicroSD</text><text x="1160" y="180" class="sm">GPIO 1 / 2 / 41 / 42</text>

<rect x="1060" y="280" width="350" height="100" rx="15" class="b c"/>
<text x="1110" y="330" class="t">EPD 1×9</text><text x="1240" y="330" class="sm">SPI + BUSY/PWR</text>

<rect x="1060" y="430" width="350" height="100" rx="15" class="b c"/>
<text x="1110" y="480" class="t">GNSS 1×5</text><text x="1240" y="480" class="sm">RX39 / TX38 / PPS14</text>

<rect x="1060" y="580" width="350" height="100" rx="15" class="b c"/>
<text x="1110" y="630" class="t">LoRa 1×6</text><text x="1240" y="630" class="sm">UART + RST + AUX</text>

<rect x="1060" y="730" width="350" height="100" rx="15" class="b c"/>
<text x="1110" y="780" class="t">CardKB2 1×4</text><text x="1240" y="780" class="sm">SDA47 / SCL21</text>

<path d="M275 185 H350" class="l"/><path d="M600 185 H680" class="l"/>
<path d="M275 230 H655 V250 H680" class="l"/><text x="460" y="225" class="sm">USB D-/D+</text>
<path d="M1010 145 H1110" class="l"/><path d="M1010 310 H1060" class="l"/>
<path d="M1010 480 H1060" class="l"/><path d="M1010 630 H1060" class="l"/><path d="M1010 780 H1060" class="l"/>
<path d="M475 260 V780 H1060" class="l"/><text x="500" y="760" class="sm">3V3_SYS 电源总线</text>
<text x="55" y="880" class="sm">注意：本图为电气分区和接口关系，不替代正式 ERC 原理图。</text>
</svg>
