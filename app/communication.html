<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>通讯模块 - 壳中灯</title>
  <link rel="icon" href="/static/assets/brand/lanternbox-icon-original.png" type="image/png" />
  <link rel="stylesheet" href="/static/style.css?v=lora-communication-v0-6" />
  <style>
    .communication-page .field-label {
      display: grid;
      gap: 8px;
      color: var(--text-soft);
      line-height: 1.45;
    }

    .communication-control-grid {
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr) 180px;
      gap: 14px;
      align-items: end;
    }

    .transport-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      min-height: 56px;
    }

    .transport-option {
      min-height: 56px;
      padding: 10px 12px;
      border-radius: 16px;
      font-size: 15px;
      box-shadow: none;
      white-space: nowrap;
    }

    .transport-option.active {
      border-color: var(--border-strong);
      color: #ffffff;
      background: rgba(104, 199, 255, 0.2);
      box-shadow: 0 0 22px var(--glow);
    }

    .bridge-summary-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .bridge-summary-card {
      padding: 16px;
      border: 1px solid rgba(137, 204, 255, 0.14);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.055);
    }

    .bridge-summary-card span {
      display: block;
      margin-bottom: 8px;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .bridge-summary-card strong {
      display: block;
      overflow-wrap: anywhere;
      color: var(--text-main);
      font-size: 20px;
      line-height: 1.25;
    }

    .composer-panel {
      display: grid;
      gap: 12px;
      padding: 14px;
      border: 1px solid rgba(104, 199, 255, 0.24);
      border-radius: 8px;
      background: rgba(3, 15, 30, 0.28);
    }

    .message-target-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .target-summary {
      display: grid;
      gap: 4px;
      min-height: 48px;
      padding: 4px 0;
    }

    .target-summary span {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .target-summary strong {
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .target-summary small {
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .message-composer {
      display: grid;
      gap: 10px;
    }

    .message-composer textarea {
      min-height: 118px;
      resize: vertical;
      border-color: rgba(104, 199, 255, 0.2);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.18);
    }

    .composer-footer {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .char-count {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.4;
    }

    .composer-footer button {
      min-width: 132px;
    }

    .node-list {
      display: grid;
      gap: 10px;
    }

    .lora-node-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 14px;
      border: 1px solid rgba(137, 204, 255, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.045);
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .lora-node-card.online {
      border-color: rgba(80, 220, 160, 0.32);
      background: rgba(40, 180, 120, 0.1);
    }

    .lora-node-card.selected {
      border-color: rgba(255, 209, 138, 0.56);
      background: rgba(255, 164, 64, 0.12);
      box-shadow: 0 0 0 3px rgba(255, 180, 92, 0.08);
    }

    .lora-node-card:disabled {
      cursor: not-allowed;
      opacity: 0.7;
    }

    .node-main {
      min-width: 0;
    }

    .node-main h3 {
      margin: 0 0 6px;
      color: var(--text-main);
      font-size: 17px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .node-main p {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .node-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      min-height: 30px;
      padding: 5px 10px;
      border: 1px solid rgba(137, 204, 255, 0.24);
      border-radius: 999px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.055);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .node-status-stack {
      display: grid;
      gap: 8px;
      justify-items: end;
    }

    .lora-node-card.online .node-status {
      color: #dfffea;
      border-color: rgba(80, 220, 160, 0.42);
      background: rgba(40, 180, 120, 0.16);
    }

    .node-target-status {
      color: #ffd18a;
      border-color: rgba(255, 180, 92, 0.46);
      background: rgba(255, 164, 64, 0.14);
    }

    .message-feed {
      display: grid;
      gap: 10px;
      min-height: 280px;
      max-height: 520px;
      overflow-y: auto;
      padding: 12px;
      border: 1px solid rgba(104, 199, 255, 0.2);
      border-radius: 8px;
      background: rgba(2, 12, 24, 0.28);
    }

    .lora-message {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 12px;
      border: 1px solid rgba(104, 199, 255, 0.26);
      border-radius: 8px;
      background: rgba(104, 199, 255, 0.055);
    }

    .lora-message.tx {
      border-color: rgba(104, 199, 255, 0.3);
      background: rgba(104, 199, 255, 0.07);
    }

    .message-direction {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      min-height: 28px;
      padding: 4px 8px;
      border: 1px solid rgba(137, 204, 255, 0.24);
      border-radius: 999px;
      color: var(--accent-bright);
      background: rgba(104, 199, 255, 0.08);
      font-size: 12px;
      font-weight: 900;
    }

    .lora-message.tx .message-direction {
      color: var(--accent-bright);
      border-color: rgba(137, 204, 255, 0.24);
      background: rgba(104, 199, 255, 0.08);
    }

    .message-body {
      min-width: 0;
    }

    .message-text {
      margin: 0;
      color: var(--text-main);
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-meta {
      margin: 8px 0 0;
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .communication-actions {
      margin-top: 14px;
    }

    @media (max-width: 820px) {
      .communication-control-grid,
      .message-target-row,
      .message-composer,
      .composer-footer {
        grid-template-columns: 1fr;
      }

      .bridge-summary-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .composer-footer {
        display: grid;
      }

      .composer-footer button,
      .message-target-row button {
        width: 100%;
      }

      .node-status-stack {
        justify-items: start;
      }
    }

    @media (max-width: 560px) {
      .bridge-summary-grid {
        grid-template-columns: 1fr;
      }

      .lora-message {
        grid-template-columns: 1fr;
      }

      .message-direction {
        justify-self: start;
      }
    }
  </style>
</head>
<body>
  <main class="shell communication-page">
    <section class="hero compact-hero">
      <div class="page-header-row">
        <div>
          <p class="eyebrow">LORA COMMUNICATION</p>
          <h1 class="brand-title"><img class="brand-mark-inline" src="/static/assets/brand/lanternbox-icon-original.webp" alt="" />通讯模块</h1>
          <p class="subtitle">Heltec WiFi LoRa 32 V3 接收端与 Core 本地消息台。支持 USB Serial 和蓝牙串口两种连接方式。</p>
        </div>
        <div class="page-actions">
          <a class="page-nav-button" href="/">返回总览</a>
          <a class="page-nav-button" href="/status.html">系统自检</a>
          <a class="page-nav-button" href="/terminals.html">终端设备</a>
        </div>
      </div>
      <p id="communication-message" class="notice" style="display:none;"></p>
    </section>

    <section class="list-section">
      <div class="section-title-row">
        <h2>接收端连接</h2>
        <span id="bridge-status-pill" class="sync-status-pill">待机</span>
      </div>

      <div class="form-card">
        <div class="communication-control-grid">
          <label class="field-label">
            <span>连接方式</span>
            <div class="transport-toggle" role="group" aria-label="连接方式">
              <button class="transport-option active" type="button" data-transport="usb_serial">USB</button>
              <button class="transport-option" type="button" data-transport="ble_uart">蓝牙 BLE</button>
            </div>
          </label>

          <label class="field-label">
            <span id="port-label">串口</span>
            <select id="port-select" class="select-input">
              <option value="">请先扫描设备</option>
            </select>
          </label>

          <label class="field-label">
            <span id="baud-label">波特率</span>
            <input id="baud-input" type="number" min="1200" step="1" value="115200" />
          </label>
        </div>

        <div class="page-actions communication-actions">
          <button id="scan-ports-button" class="small-button" type="button">扫描串口</button>
          <button id="connect-button" class="small-button" type="button">连接接收端</button>
          <button id="disconnect-button" class="small-button" type="button">断开连接</button>
        </div>
      </div>
    </section>

    <section class="list-section">
      <div class="section-title-row">
        <h2>链路状态</h2>
      </div>

      <div class="bridge-summary-grid">
        <div class="bridge-summary-card">
          <span>连接</span>
          <strong id="summary-connection">未连接</strong>
        </div>
        <div class="bridge-summary-card">
          <span>接收</span>
          <strong id="summary-rx">0</strong>
        </div>
        <div class="bridge-summary-card">
          <span>发送</span>
          <strong id="summary-tx">0</strong>
        </div>
        <div class="bridge-summary-card">
          <span>最近更新</span>
          <strong id="summary-updated">--</strong>
        </div>
      </div>
    </section>

    <section class="list-section">
      <div class="section-title-row">
        <h2>短消息</h2>
        <span id="message-count-pill" class="sync-status-pill">0 条</span>
      </div>

      <div class="composer-panel">
        <div class="message-target-row">
          <div class="target-summary">
            <span>发送目标</span>
            <strong id="message-target-label">广播所有终端</strong>
            <small id="message-target-count">未选择设备</small>
          </div>
          <button id="clear-target-button" class="small-button" type="button" disabled>清除目标</button>
        </div>
        <div class="message-composer">
          <textarea id="message-input" maxlength="240" placeholder="输入短消息"></textarea>
          <div class="composer-footer">
            <span id="message-char-count" class="char-count">0 / 240</span>
            <button id="send-button" class="small-button" type="button">发送</button>
          </div>
        </div>
      </div>
    </section>

    <section class="list-section">
      <div class="section-title-row">
        <h2>在网终端</h2>
        <span id="node-count-pill" class="sync-status-pill">0 在线</span>
      </div>
      <div id="node-list" class="node-list">
        <p class="empty">连接 LoRa 接收端后，会在这里显示观察到的终端。</p>
      </div>
    </section>

    <section class="list-section">
      <div class="section-title-row">
        <h2>消息流</h2>
        <button id="clear-messages-button" class="small-button" type="button">清空记录</button>
      </div>
      <div id="message-feed" class="message-feed">
        <p class="empty">暂无 LoRa 消息。</p>
      </div>
    </section>
  </main>

  <script>
    const portSelect = document.getElementById('port-select');
    const portLabel = document.getElementById('port-label');
    const transportButtons = Array.from(document.querySelectorAll('.transport-option'));
    const baudInput = document.getElementById('baud-input');
    const baudLabel = document.getElementById('baud-label');
    const scanPortsButton = document.getElementById('scan-ports-button');
    const connectButton = document.getElementById('connect-button');
    const disconnectButton = document.getElementById('disconnect-button');
    const sendButton = document.getElementById('send-button');
    const clearMessagesButton = document.getElementById('clear-messages-button');
    const messageInput = document.getElementById('message-input');
    const messageCharCount = document.getElementById('message-char-count');
    const messageTargetLabel = document.getElementById('message-target-label');
    const messageTargetCount = document.getElementById('message-target-count');
    const clearTargetButton = document.getElementById('clear-target-button');
    const messageFeed = document.getElementById('message-feed');
    const nodeList = document.getElementById('node-list');
    const messageBox = document.getElementById('communication-message');
    const bridgeStatusPill = document.getElementById('bridge-status-pill');
    const messageCountPill = document.getElementById('message-count-pill');
    const nodeCountPill = document.getElementById('node-count-pill');
    const summaryConnection = document.getElementById('summary-connection');
    const summaryRx = document.getElementById('summary-rx');
    const summaryTx = document.getElementById('summary-tx');
    const summaryUpdated = document.getElementById('summary-updated');

    let statusTimer = null;
    let messageTimer = null;
    let nodeTimer = null;
    let activeTransport = 'usb_serial';
    let latestNodes = [];
    let latestOnlineCount = 0;
    let selectedTargetIds = [];

    function transportLabel(value) {
      if (value === 'ble_uart') return '蓝牙 BLE';
      if (value === 'bluetooth_serial') return '蓝牙串口';
      return 'USB Serial';
    }

    function connectionText(bridge) {
      if (!bridge || !bridge.connected) return '未连接';
      if (bridge.transport === 'ble_uart') {
        return `${transportLabel(bridge.transport)} · ${bridge.port}`;
      }
      return `${transportLabel(bridge.transport)} · ${bridge.port} @ ${bridge.baud}`;
    }

    function updateTransportUi() {
      const transport = activeTransport;
      const isBle = transport === 'ble_uart';
      transportButtons.forEach(button => {
        const active = button.dataset.transport === transport;
        button.classList.toggle('active', active);
        button.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      portLabel.textContent = isBle ? 'BLE 设备' : '串口';
      baudLabel.textContent = isBle ? 'BLE UART' : '波特率';
      baudInput.disabled = isBle;
      baudInput.style.opacity = isBle ? '0.58' : '1';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    async function readError(response, fallback) {
      try {
        const data = await response.json();
        return data.detail || data.message || data.error || fallback;
      } catch (error) {
        return fallback;
      }
    }

    function showMessage(message, isError = false) {
      messageBox.style.display = 'block';
      messageBox.textContent = message;
      messageBox.style.borderColor = isError ? 'rgba(255, 123, 138, 0.42)' : 'rgba(137, 204, 255, 0.18)';
      messageBox.style.color = isError ? '#ffe0e6' : '#b7d2e8';
    }

    function setBridgeStatus(text, failed = false) {
      bridgeStatusPill.textContent = text;
      bridgeStatusPill.classList.toggle('failed', failed);
    }

    function renderStatus(bridge) {
      const connected = Boolean(bridge && bridge.connected);
      const failed = bridge && bridge.status === 'error';
      setBridgeStatus(connected ? '已连接' : failed ? '异常' : '待机', failed);
      summaryConnection.textContent = connectionText(bridge);
      summaryRx.textContent = bridge ? String(bridge.rx_count || 0) : '0';
      summaryTx.textContent = bridge ? String(bridge.tx_count || 0) : '0';
      summaryUpdated.textContent = bridge && bridge.updated_at ? bridge.updated_at : '--';
      sendButton.disabled = !connected;
      disconnectButton.disabled = !connected;
      connectButton.disabled = connected;
      transportButtons.forEach(button => {
        button.disabled = connected;
      });
      portSelect.disabled = connected;
      baudInput.disabled = connected || activeTransport === 'ble_uart';
      if (bridge && bridge.error) {
        showMessage(bridge.error, true);
      }
    }

    function updateMessageCharCount() {
      const maxLength = Number(messageInput.getAttribute('maxlength') || 240);
      messageCharCount.textContent = `${messageInput.value.length} / ${maxLength}`;
    }

    function formatMeta(message) {
      const parts = [message.created_at || '--'];
      const metadata = message.metadata || {};
      if (message.transport) parts.push(transportLabel(message.transport));
      if (message.port) parts.push(message.port);
      if (message.direction === 'tx') {
        const targets = Array.isArray(metadata.targets) ? metadata.targets : (metadata.target ? [metadata.target] : []);
        parts.push(targets.length ? `目标 ${targets.map(targetDisplayText).join('，')}` : '广播');
      }
      if (message.rssi !== null && message.rssi !== undefined) parts.push(`RSSI ${message.rssi}`);
      if (message.snr !== null && message.snr !== undefined) parts.push(`SNR ${message.snr}`);
      return parts.join(' ｜ ');
    }

    function renderMessages(messages) {
      messageCountPill.textContent = `${messages.length} 条`;
      if (!messages.length) {
        messageFeed.innerHTML = '<p class="empty">暂无 LoRa 消息。</p>';
        return;
      }

      messageFeed.innerHTML = messages.map(message => {
        const direction = message.direction === 'tx' ? 'tx' : 'rx';
        const label = direction === 'tx' ? 'TX' : 'RX';
        return `
          <article class="lora-message ${direction}">
            <span class="message-direction">${label}</span>
            <div class="message-body">
              <p class="message-text">${escapeHtml(message.text || '')}</p>
              <p class="message-meta">${escapeHtml(formatMeta(message))}</p>
            </div>
          </article>
        `;
      }).join('');
      messageFeed.scrollTop = messageFeed.scrollHeight;
    }

    function nodeUser(node) {
      const metadata = node && node.metadata ? node.metadata : {};
      if (metadata.user && typeof metadata.user === 'object') return metadata.user;
      if (metadata.node && metadata.node.user && typeof metadata.node.user === 'object') return metadata.node.user;
      return {};
    }

    function isPlaceholderName(name, id) {
      const value = String(name || '').trim().toLowerCase();
      if (!value) return true;
      return value === String(id || '').trim().toLowerCase() || value.startsWith('0x') || value.startsWith('!');
    }

    function nodeLongName(node) {
      const user = nodeUser(node);
      const id = String(node.node_id || '').trim();
      const direct = String(node.long_name || user.longName || user.long_name || '').trim();
      if (direct) return direct;
      const name = String(node.name || '').trim();
      return isPlaceholderName(name, id) ? '' : name;
    }

    function nodeShortName(node) {
      const user = nodeUser(node);
      return String(node.short_name || user.shortName || user.short_name || '').trim();
    }

    function nodeDisplayName(node) {
      const id = String(node.node_id || '').trim();
      return nodeLongName(node) || nodeShortName(node) || id || '未知终端';
    }

    function nodeTitle(node) {
      const id = String(node.node_id || '').trim();
      const name = nodeDisplayName(node);
      return id && name !== id ? `${name} · ${id}` : name;
    }

    function findNodeById(nodeId) {
      return latestNodes.find(node => String(node.node_id || '').trim() === nodeId);
    }

    function targetDisplayText(nodeId) {
      const node = findNodeById(nodeId);
      if (!node) return nodeId;
      const name = nodeDisplayName(node);
      return name && name !== nodeId ? `${name} · ${nodeId}` : nodeId;
    }

    function isSelectedTarget(nodeId) {
      return selectedTargetIds.includes(nodeId);
    }

    function nodeMeta(node) {
      const parts = [];
      const shortName = nodeShortName(node);
      const id = String(node.node_id || '').trim();
      if (shortName) parts.push(`短名 ${shortName}`);
      if (id) parts.push(`ID ${id}`);
      if (node.role) parts.push(node.role);
      if (node.transport) parts.push(transportLabel(node.transport));
      if (node.rssi !== null && node.rssi !== undefined) parts.push(`RSSI ${node.rssi}`);
      if (node.snr !== null && node.snr !== undefined) parts.push(`SNR ${node.snr}`);
      if (node.message_count !== undefined) parts.push(`消息 ${node.message_count}`);
      if (node.last_seen_at) parts.push(`最后 ${node.last_seen_at}`);
      return parts.join(' ｜ ');
    }

    function renderNodes(nodes, onlineCount) {
      latestNodes = Array.isArray(nodes) ? nodes : [];
      latestOnlineCount = Number(onlineCount || 0);
      selectedTargetIds = selectedTargetIds.filter(nodeId =>
        latestNodes.some(node => String(node.node_id || '').trim() === nodeId && node.online)
      );
      renderSelectedTarget();
      nodeCountPill.textContent = `${latestOnlineCount} 在线`;
      if (!nodes.length) {
        nodeList.innerHTML = '<p class="empty">还没有观察到 LoRa 终端。若 Heltec 固件支持节点列表，请等待节点广播或发送节点上报。</p>';
        return;
      }

      nodeList.innerHTML = nodes.map(node => {
        const id = String(node.node_id || '').trim();
        const selected = id && isSelectedTarget(id);
        const disabled = node.online ? '' : 'disabled';
        return `
        <button class="lora-node-card ${node.online ? 'online' : ''} ${selected ? 'selected' : ''}" type="button" data-node-id="${escapeHtml(id)}" ${disabled}>
          <div class="node-main">
            <h3>${escapeHtml(nodeTitle(node))}</h3>
            <p>${escapeHtml(nodeMeta(node) || '暂无链路信息')}</p>
          </div>
          <span class="node-status-stack">
            <span class="node-status">${node.online ? '在线' : '离线'}</span>
            ${selected ? '<span class="node-status node-target-status">目标</span>' : ''}
          </span>
        </button>
      `;
      }).join('');
    }

    function renderSelectedTarget() {
      if (!selectedTargetIds.length) {
        messageTargetLabel.textContent = '广播所有终端';
        messageTargetCount.textContent = '未选择设备';
        clearTargetButton.disabled = true;
        return;
      }
      messageTargetLabel.textContent = selectedTargetIds.map(targetDisplayText).join('，');
      messageTargetCount.textContent = `已选择 ${selectedTargetIds.length} 个设备`;
      clearTargetButton.disabled = false;
    }

    function selectTarget(nodeId) {
      const node = findNodeById(nodeId);
      if (!node || !node.online) return;
      selectedTargetIds = isSelectedTarget(nodeId)
        ? selectedTargetIds.filter(id => id !== nodeId)
        : [...selectedTargetIds, nodeId];
      renderSelectedTarget();
      renderNodes(latestNodes, latestOnlineCount);
    }

    async function scanPorts() {
      const transport = activeTransport;
      scanPortsButton.disabled = true;
      scanPortsButton.textContent = '扫描中...';
      try {
        const response = await fetch(`/api/lora/ports?transport=${encodeURIComponent(transport)}`, { cache: 'no-store' });
        const data = await response.json();
        if (!response.ok || data.ok === false) {
          throw new Error(data.message || '串口扫描失败');
        }

        const ports = Array.isArray(data.ports) ? data.ports : [];
        if (!ports.length) {
          portSelect.innerHTML = '<option value="">未发现串口</option>';
          showMessage(data.message || `没有发现可用${transportLabel(transport)}设备。`, true);
          return;
        }

        portSelect.innerHTML = ports.map(port => {
          const marker = port.likely_lora ? 'LoRa 候选' : transportLabel(port.transport);
          const label = `${port.device}｜${port.description || marker}`;
          return `<option value="${escapeHtml(port.device)}">${escapeHtml(label)}</option>`;
        }).join('');
        showMessage(`已扫描 ${transportLabel(transport)}，发现 ${ports.length} 个候选设备。`);
      } catch (error) {
        console.error(error);
        showMessage(error.message || '串口扫描失败。', true);
      } finally {
        scanPortsButton.disabled = false;
        scanPortsButton.textContent = '扫描串口';
      }
    }

    async function refreshStatus() {
      clearTimeout(statusTimer);
      try {
        const response = await fetch('/api/lora/status', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(await readError(response, `读取状态失败：${response.status}`));
        }
        const data = await response.json();
        renderStatus(data.bridge || {});
      } catch (error) {
        console.error(error);
        setBridgeStatus('读取失败', true);
      } finally {
        statusTimer = setTimeout(refreshStatus, 1500);
      }
    }

    async function refreshMessages() {
      clearTimeout(messageTimer);
      try {
        const response = await fetch('/api/lora/messages?limit=160', { cache: 'no-store' });
        if (response.ok) {
          const data = await response.json();
          renderMessages(Array.isArray(data.messages) ? data.messages : []);
        }
      } finally {
        messageTimer = setTimeout(refreshMessages, 1200);
      }
    }

    async function refreshNodes() {
      clearTimeout(nodeTimer);
      try {
        const response = await fetch('/api/lora/nodes?limit=160&online_window_seconds=900', { cache: 'no-store' });
        if (response.ok) {
          const data = await response.json();
          renderNodes(Array.isArray(data.nodes) ? data.nodes : [], Number(data.online_count || 0));
        }
      } finally {
        nodeTimer = setTimeout(refreshNodes, 1500);
      }
    }

    async function connectBridge() {
      const port = portSelect.value;
      const transport = activeTransport;
      const baud = transport === 'ble_uart' ? 0 : Number(baudInput.value || 115200);
      if (!port) {
        showMessage(`请先选择 Heltec ${transportLabel(transport)}设备。`, true);
        return;
      }

      connectButton.disabled = true;
      try {
        const response = await fetch('/api/lora/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ port, baud, transport })
        });
        if (!response.ok) {
          throw new Error(await readError(response, `连接失败：${response.status}`));
        }
        const data = await response.json();
        renderStatus(data.bridge || {});
        const bridge = data.bridge || {};
        const bootstrapText = bridge.node_bootstrap_status
          ? `；节点获取 ${bridge.node_bootstrap_status === 'ok' ? `完成，${bridge.node_bootstrap_count || 0} 个` : `失败：${bridge.node_bootstrap_error || '未知错误'}`}`
          : '';
        showMessage(`已通过 ${transportLabel(transport)} 连接 ${port}${bootstrapText}`);
        await refreshNodes();
      } catch (error) {
        console.error(error);
        showMessage(error.message || '连接失败。', true);
      } finally {
        await refreshStatus();
      }
    }

    async function disconnectBridge() {
      disconnectButton.disabled = true;
      try {
        const response = await fetch('/api/lora/disconnect', { method: 'POST' });
        if (!response.ok) {
          throw new Error(await readError(response, `断开失败：${response.status}`));
        }
        const data = await response.json();
        renderStatus(data.bridge || {});
        showMessage('接收端已断开。');
      } catch (error) {
        console.error(error);
        showMessage(error.message || '断开失败。', true);
      } finally {
        await refreshStatus();
      }
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      const targets = [...selectedTargetIds];
      if (!text) {
        showMessage('请输入短消息。', true);
        return;
      }
      sendButton.disabled = true;
      try {
        const response = await fetch('/api/lora/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text, targets })
        });
        if (!response.ok) {
          throw new Error(await readError(response, `发送失败：${response.status}`));
        }
        const data = await response.json();
        renderStatus(data.bridge || {});
        messageInput.value = '';
        updateMessageCharCount();
        showMessage(targets.length ? `已发送给 ${targets.length} 个设备。` : '已广播发送。');
        await refreshMessages();
      } catch (error) {
        console.error(error);
        showMessage(error.message || '发送失败。', true);
      } finally {
        await refreshStatus();
      }
    }

    async function clearMessages() {
      const confirmed = window.confirm('确定要清空消息记录吗？这会删除数据库中的 LoRa 消息流记录。');
      if (!confirmed) {
        return;
      }
      clearMessagesButton.disabled = true;
      try {
        const response = await fetch('/api/lora/messages', { method: 'DELETE' });
        if (!response.ok) {
          throw new Error(await readError(response, `清空失败：${response.status}`));
        }
        renderMessages([]);
        showMessage('消息记录已清空。');
      } catch (error) {
        console.error(error);
        showMessage(error.message || '清空失败。', true);
      } finally {
        clearMessagesButton.disabled = false;
      }
    }

    scanPortsButton.addEventListener('click', scanPorts);
    transportButtons.forEach(button => {
      button.addEventListener('click', () => {
        activeTransport = button.dataset.transport || 'usb_serial';
        updateTransportUi();
        portSelect.innerHTML = '<option value="">请先扫描设备</option>';
        scanPorts();
      });
    });
    connectButton.addEventListener('click', connectBridge);
    disconnectButton.addEventListener('click', disconnectBridge);
    sendButton.addEventListener('click', sendMessage);
    clearTargetButton.addEventListener('click', () => {
      selectedTargetIds = [];
      renderSelectedTarget();
      renderNodes(latestNodes, latestOnlineCount);
    });
    clearMessagesButton.addEventListener('click', clearMessages);
    nodeList.addEventListener('click', event => {
      const button = event.target.closest('button[data-node-id]');
      if (!button) return;
      selectTarget(button.dataset.nodeId || '');
    });
    messageInput.addEventListener('keydown', event => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        sendMessage();
      }
    });
    messageInput.addEventListener('input', updateMessageCharCount);

    sendButton.disabled = true;
    disconnectButton.disabled = true;
    updateMessageCharCount();
    updateTransportUi();
    scanPorts();
    refreshStatus();
    refreshMessages();
    refreshNodes();
  </script>
</body>
</html>
